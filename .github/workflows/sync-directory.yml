name: Sync directory from Chabad on Campus API

on:
  schedule:
    # Once a day at 09:17 UTC (5:17am Eastern). Off the hour to avoid queue delays.
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: directory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync center data
        id: sync
        # The script exits 1 if any center failed. Stored data for that
        # center is left untouched, so we still commit the good updates
        # and fail the job afterwards so GitHub emails a notification.
        continue-on-error: true
        run: node scripts/sync.mjs

      - name: Commit changed data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cocfl-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Directory sync: update center data from Chabad on Campus API"
            git push
            echo "Committed data changes; Cloudflare Pages will rebuild the site."
          else
            echo "No data changes today."
          fi

      - name: Report sync errors
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more centers failed to sync. Their stored data was kept. See the sync step log and data/sync-log.json."
          exit 1
